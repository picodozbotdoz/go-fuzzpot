# fuzzpot configuration

ports:
  ranges:
    - from: 2000
      to: 5000
    - from: 8000
      to: 9000
  exclude:
    - 2222   # Cowrie SSH
    - 2223   # Cowrie Telnet
    - 3306   # MySQL
    - 5432   # PostgreSQL
    - 6379   # Redis
    - 27017  # MongoDB

capture:
  read_timeout_sec: 10      # seconds to wait for payload data
  max_payload_size: 65536   # max bytes to capture per connection (64KB)
  # log_hex_payload: true   # set false to omit hex dump (saves ~2x log space)

# Resource caps. Omitted values fall back to: 64 MB budget, 64 conns/port,
# 32 conns/IP. Keep memory_budget_mb below the systemd unit's MemoryMax.
limits:
  memory_budget_mb: 64      # estimated in-flight handler footprint cap
  max_concurrent_per_port: 64
  max_concurrent_per_ip: 32

logging:
  dir: /var/log/fuzzpot
  file: payloads.log
  rotate_mb: 50         # rotate individual log file after this many MB
  keep_files: 10        # keep at most this many rotated files (0 = unlimited)
  compress: false       # gzip rotated files (after compress_delay_sec, so the
                        # analyzer can drain them while still plain text)
  compress_delay_sec: 60
  fsync_writes: false   # fsync after every event (durable but slow)

refresh:
  interval_sec: 60  # re-scan /proc/net/tcp every 60 seconds

# Instance identity written as `sensor` on every payload and security log
# line (schema v3). Leave empty to use the hostname. Printable ASCII, no
# spaces, at most 253 bytes.
sensor:
  name: ""
